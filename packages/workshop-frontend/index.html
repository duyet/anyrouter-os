<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Apply the stored / OS theme before the CSS bundle paints. `applyStoredThemeMode()` in
      main.tsx runs only after the module graph (and styles.css) load, which flashes light
      tokens at dark-preferring visitors. Keep the localStorage key in sync with
      THEME_MODE_STORAGE_KEY in src/theme.ts.
    -->
    <meta name="theme-color" content="#ffffff" />
    <style>
      html,body{background-color:#ffffff;color:#0a0a0a;color-scheme:light}
      @media (prefers-color-scheme: dark){
        html:not(.light):not([data-mode=light]),
        html:not(.light):not([data-mode=light]) body
        {background-color:#0a0a0a;color:#fafafa;color-scheme:dark}
      }
      html.dark,html[data-mode=dark],body.dark,body[data-mode=dark]
      {background-color:#0a0a0a;color:#fafafa;color-scheme:dark}
      html.light,html[data-mode=light],body.light,body[data-mode=light]
      {background-color:#ffffff;color:#0a0a0a;color-scheme:light}
    </style>
    <script>
      (function () {
        var mode = 'light'
        try {
          var stored = localStorage.getItem('gadgets:theme-mode')
          if (stored === 'light' || stored === 'dark') {
            mode = stored
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            mode = 'dark'
          }
        } catch (e) {}
        var root = document.documentElement
        var dark = mode === 'dark'
        root.setAttribute('data-mode', mode)
        root.classList.toggle('dark', dark)
        root.classList.toggle('light', !dark)
        root.style.colorScheme = mode
        var meta = document.querySelector('meta[name="color-scheme"]')
        if (!meta) {
          meta = document.createElement('meta')
          meta.setAttribute('name', 'color-scheme')
          document.head.appendChild(meta)
        }
        meta.setAttribute('content', mode)
        var color = document.querySelector('meta[name="theme-color"]')
        if (!color) {
          color = document.createElement('meta')
          color.setAttribute('name', 'theme-color')
          document.head.appendChild(color)
        }
        color.removeAttribute('media')
        color.setAttribute('content', dark ? '#0a0a0a' : '#ffffff')
      })()
    </script>

    <!--
      Parent-document lock: a Gadget UI srcdoc frame cannot navigate to the network (its own CSP
      cannot stop that). DO NOT REMOVE srcdoc:. Clerk's hosted <SignIn> (and Turnstile / Clerk
      protection frames) also load as iframes, so this deployment's Clerk origins are allowlisted —
      FAPI from CLERK_PUBLISHABLE_KEY (clerk.anyrouter.dev), Account Portal, Turnstile, protect.
      Do not widen to https: or *.
    -->
    <meta http-equiv="Content-Security-Policy" content="frame-src srcdoc: https://clerk.anyrouter.dev https://accounts.anyrouter.dev https://challenges.cloudflare.com https://*.protect.clerk.com;">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <title>AnyRouter OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
